name: Release

on:
  release:
    types: [created]

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up signing
        env:
          ONEUIX_SIGNING_BUNDLE: ${{ secrets.ONEUIX_SIGNING_BUNDLE }}
        run: |
          if [ -z "$ONEUIX_SIGNING_BUNDLE" ]; then
            echo "::error::Missing ONEUIX_SIGNING_BUNDLE repository secret. No APK will be published with an ephemeral debug key."
            exit 1
          fi
          umask 077
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(base64.b64decode(os.environ["ONEUIX_SIGNING_BUNDLE"].strip(), validate=True))
          key_bytes = base64.b64decode(bundle["keystore_base64"], validate=True)
          password = bundle["password"]
          alias = bundle["alias"]
          if not key_bytes or alias != "oneuix" or not password.isascii() or not password.replace("-", "").replace("_", "").isalnum():
              raise ValueError("Invalid signing bundle")
          Path("app/release.keystore").write_bytes(key_bytes)
          Path("keystore.properties").write_text(
              f"storeFile=release.keystore\nstorePassword={password}\n"
              f"keyAlias={alias}\nkeyPassword={password}\n",
              encoding="utf-8"
          )
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Verify Release signature
        env:
          EXPECTED_CERT_SHA256: 9af27a4151d59f946e24aba5edd2221e005cea77c309d800281c7a0eaea490ca
        run: |
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not configured"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found"
            exit 1
          fi
          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$SIGNATURE_INFO" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Verified signing certificate: $ACTUAL_CERT_SHA256"

      - name: Rename APK
        run: | 
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/OneUIX_${{ github.ref_name }}.apk

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/OneUIX_*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
