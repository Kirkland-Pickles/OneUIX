name: CI

permissions:
  contents: write

# 触发条件：所有分支的 push 和 PR 都会触发
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      # 仓库内的构建使用与 Release 相同的签名，以便互相覆盖安装。
      # Fork PR 无法访问 Secrets，因此只做编译检查，不上传 APK。
      - name: Set up signing
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ONEUIX_SIGNING_BUNDLE: ${{ secrets.ONEUIX_SIGNING_BUNDLE }}
        run: |
          if [ -z "$ONEUIX_SIGNING_BUNDLE" ]; then
            echo "::error::Missing ONEUIX_SIGNING_BUNDLE repository secret. No APK will be published with an ephemeral debug key."
            exit 1
          fi
          umask 077
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(base64.b64decode(os.environ["ONEUIX_SIGNING_BUNDLE"].strip(), validate=True))
          key_bytes = base64.b64decode(bundle["keystore_base64"], validate=True)
          password = bundle["password"]
          alias = bundle["alias"]
          if not key_bytes or alias != "oneuix" or not password.isascii() or not password.replace("-", "").replace("_", "").isalnum():
              raise ValueError("Invalid signing bundle")
          Path("app/release.keystore").write_bytes(key_bytes)
          Path("keystore.properties").write_text(
              f"storeFile=release.keystore\nstorePassword={password}\n"
              f"keyAlias={alias}\nkeyPassword={password}\n",
              encoding="utf-8"
          )
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 获取当前 commit 的前 7 位短 Hash，并存入环境变量 SHORT_SHA 中
      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 构建 Debug 包
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify Debug signature
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          EXPECTED_CERT_SHA256: 9af27a4151d59f946e24aba5edd2221e005cea77c309d800281c7a0eaea490ca
        run: |
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$SIGNATURE_INFO" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected APK signature: $ACTUAL_CERT_SHA256 (expected $EXPECTED_CERT_SHA256)"
            exit 1
          fi
          echo "Verified persistent OneUIX signing certificate: $ACTUAL_CERT_SHA256"

      # 重命名 Debug 包
      # github.ref_name: 分支名 (例如 main)
      # github.run_number: Actions 的历史运行编号 (例如 15)
      # env.SHORT_SHA: 刚刚获取的 7 位 commit 标识 (例如 a1b2c3d)
      - name: Rename APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"

      # 上传产物
      - name: Upload APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          # name: OneUIX-Debug-${{ github.ref_name }}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
